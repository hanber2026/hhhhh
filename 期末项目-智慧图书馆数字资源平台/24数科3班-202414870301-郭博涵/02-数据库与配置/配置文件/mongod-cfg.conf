storage:
  dbPath: /data/mongodb/cfg/db
  wiredTiger:
    engineConfig:
      cacheSizeGB: 0.25
systemLog:
  destination: file
  path: /data/mongodb/cfg/log/mongod.log
  logAppend: true
net:
  port: 27019
  bindIp: 0.0.0.0
replication:
  replSetName: csrs
sharding:
  clusterRole: configsvr
security:
  keyFile: /data/mongodb/rs/keyfile
  authorization: enabled
processManagement:
  fork: true
  pidFilePath: /data/mongodb/cfg/mongod.pid
