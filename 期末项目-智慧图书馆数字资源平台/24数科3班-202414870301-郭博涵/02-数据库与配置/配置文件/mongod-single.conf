storage:
  dbPath: /data/mongodb/single/db
  wiredTiger:
    engineConfig:
      cacheSizeGB: 0.5

systemLog:
  destination: file
  path: /data/mongodb/single/log/mongod.log
  logAppend: true

net:
  port: 27017
  bindIp: 0.0.0.0

processManagement:
  fork: true
  pidFilePath: /data/mongodb/single/mongod.pid
security:
  authorization: enabled
