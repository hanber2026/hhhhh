storage:
  dbPath: /data/mongodb/rs/db
  wiredTiger:
    engineConfig:
      cacheSizeGB: 0.5
systemLog:
  destination: file
  path: /data/mongodb/rs/log/mongod.log
  logAppend: true
net:
  port: 27017
  bindIp: 0.0.0.0
replication:
  replSetName: rs0
security:
  keyFile: /data/mongodb/rs/keyfile
  authorization: enabled
processManagement:
  fork: true
  pidFilePath: /data/mongodb/rs/mongod.pid
