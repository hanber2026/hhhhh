storage:
  dbPath: /data/mongodb/shard/db
  wiredTiger:
    engineConfig:
      cacheSizeGB: 0.25
systemLog:
  destination: file
  path: /data/mongodb/shard/log/mongod.log
  logAppend: true
net:
  port: 27018
  bindIp: 0.0.0.0
replication:
  replSetName: shard1
sharding:
  clusterRole: shardsvr
security:
  keyFile: /data/mongodb/rs/keyfile
  authorization: enabled
processManagement:
  fork: true
  pidFilePath: /data/mongodb/shard/mongod.pid
